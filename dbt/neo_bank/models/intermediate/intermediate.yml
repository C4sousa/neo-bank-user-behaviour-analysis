version: 2

models:

  - name: int_user_profile

    description: >
      Reusable analytical user profile model containing one record per user.
      This intermediate model combines user demographic, subscription,
      referral and device information into a single analytical user
      dimension for downstream KPI models and business marts used to
      analyse engagement, retention and churn.

    config:

      contract:

        enforced: true

    columns:

      - name: user_id

        description: >
          Unique identifier for each NeoBank user.
          Acts as the primary key of the model and uniquely identifies
          each analytical user profile.

        data_type: string

        tests:
          - unique
          - not_null

      - name: birth_year

        description: >
          Calendar year in which the user was born.
          Supports demographic segmentation across different age groups.

        data_type: int64

      - name: country

        description: >
          ISO two-letter country code representing the user's registered
          country. Used to compare user behaviour across different markets.

        data_type: string

      - name: city

        description: >
          Registered city associated with the user's account.
          Supports geographical segmentation where appropriate.

        data_type: string

      - name: created_at

        description: >
          Timestamp when the user account was created.
          Represents the user's onboarding date and serves as the
          starting point for lifecycle analysis.

        data_type: timestamp

      - name: plan

        description: >
          Subscription plan currently assigned to the user.
          Used to compare user behaviour across subscription tiers.

          Possible values:

          • STANDARD

          • PREMIUM

          • PREMIUM_FREE

          • PREMIUM_OFFER

          • METAL

          • METAL_FREE

        data_type: string

        tests:
          - accepted_values:
              arguments:
                values:
                  - STANDARD
                  - PREMIUM
                  - PREMIUM_FREE
                  - PREMIUM_OFFER
                  - METAL
                  - METAL_FREE

      - name: crypto_enabled

        description: >
          Boolean indicator showing whether the cryptocurrency feature
          has been unlocked for the user.
          Used to analyse the relationship between crypto adoption,
          engagement and retention.

        data_type: boolean

      - name: marketing_push_enabled

        description: >
          Boolean indicator showing whether the user has enabled
          marketing push notifications.

        data_type: boolean

      - name: marketing_email_enabled

        description: >
          Boolean indicator showing whether the user has enabled
          marketing email communications.

        data_type: boolean

      - name: num_contacts

        description: >
          Number of contacts imported or connected by the user.
          May indicate engagement with the NeoBank ecosystem.

        data_type: int64

      - name: num_referrals

        description: >
          Total number of referral invitations made by the user.

        data_type: int64

      - name: num_successful_referrals

        description: >
          Number of referral invitations that successfully resulted
          in new NeoBank users.

        data_type: int64

      - name: referred_flag

        description: >
          Boolean indicator identifying whether the user has successfully
          referred at least one new user.
          Used when analysing the relationship between referrals and
          user retention.

        data_type: boolean

      - name: device_platform

        description: >
          Mobile platform associated with the user's registered device.

          Possible values:

          • Android

          • Apple

          • Unknown

          • brand

        data_type: string

        tests:
          - accepted_values:
              arguments:
                values:
                  - Android
                  - Apple
                  - Unknown
                  - brand



  - name: int_user_activity

    description: >
      Reusable analytical user activity model containing one record per
      user. This intermediate model aggregates transaction and notification
      behaviour into reusable activity metrics that support downstream KPI
      calculations and business marts for engagement, retention and churn.

    config:
      contract:
        enforced: true

    columns:

    - name: user_id
      description: >
        Unique identifier for each NeoBank user.
        Acts as the primary key of the activity model.

      data_type: string

      tests:
        - unique
        - not_null

    - name: first_transaction_at
      description: >
        Timestamp of the user's first recorded transaction.

      data_type: timestamp

    - name: last_transaction_at
      description: >
        Timestamp of the user's most recent recorded transaction.

      data_type: timestamp

    - name: total_transactions
      description: >
        Total number of transactions performed by the user.

      data_type: int64

    - name: successful_transactions
      description: >
        Number of transactions whose transaction_state equals COMPLETED.

      data_type: int64

    - name: failed_transactions
      description: >
        Number of transactions whose transaction_state equals FAILED or DECLINED.

      data_type: int64

    - name: total_transaction_amount
      description: >
        Total monetary value (USD) of all transactions performed by the user.

      data_type: float64

    - name: first_notification_at
      description: >
        Timestamp of the first notification received by the user.

      data_type: timestamp

    - name: last_notification_at
      description: >
        Timestamp of the most recent notification received by the user.

      data_type: timestamp

    - name: total_notifications
      description: >
        Total number of notifications received by the user.

      data_type: int64

    - name: successful_notifications
      description: >
        Number of notifications successfully delivered
        (status = 'SENT').

      data_type: int64
