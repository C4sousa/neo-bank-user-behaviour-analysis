version: 2

models:

  # ============================================================
  # ANALYTICAL MARTS
  # ============================================================

  # ------------------------------------------------------------
  # ENGAGEMENT
  # ------------------------------------------------------------

  - name: mart_engagement

    description: >
      Analysis-ready user-level dataset for approved Engagement
      hypotheses. Combines the standardised Engagement outcome
      with the analytical variables required for downstream
      investigation.
      Grain: one row per user.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: engagement_flag
        description: >
          Business-defined Engagement outcome calculated by
          int_engagement.
        data_type: boolean
        tests:
          - not_null

      - name: transaction_frequency_30d
        description: >
          Count of successful transactions completed by the user
          during the approved 30-day activity window.
        data_type: int64

      - name: crypto_adoption
        description: >
          Binary indicator representing whether cryptocurrency
          functionality is enabled for the user.
          0 = not enabled, 1 = enabled.
        data_type: int64

      - name: plan_segment
        description: >
          Standardised user plan segment. PREMIUM represents users
          on the Premium plan; all other users are classified as
          STANDARD.
        data_type: string

      - name: notification_frequency_30d
        description: >
          Count of successfully delivered notifications received
          by the user during the approved 30-day activity window.
          Represents notification exposure rather than interaction.
        data_type: int64

      - name: merchant_spending_category
        description: >
          Merchant Category Code with the highest total successful
          transaction amount for the user during the approved
          30-day activity window. Null when no eligible MCC is
          available.
        data_type: int64

      - name: country
        description: >
          Country associated with the user.
        data_type: string

      - name: activity_period
        description: >
          Calendar week associated with the user's most recent
          successful transaction. The calendar week begins on Monday.
        data_type: date


  # ------------------------------------------------------------
  # RETENTION
  # ------------------------------------------------------------

  - name: mart_retention

    description: >
      Analysis-ready user-level dataset for approved Retention
      hypotheses. Combines the standardised Retention outcome
      with the analytical variables required for downstream
      investigation.
      Grain: one row per user.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: retention_flag
        description: >
          Business-defined Retention outcome calculated by
          int_retention.
        data_type: boolean
        tests:
          - not_null

      - name: transaction_frequency_30d
        description: >
          Count of successful transactions completed by the user
          during the approved 30-day activity window.
        data_type: int64

      - name: crypto_adoption
        description: >
          Binary indicator representing whether cryptocurrency
          functionality is enabled for the user.
          0 = not enabled, 1 = enabled.
        data_type: int64

      - name: plan_segment
        description: >
          Standardised user plan segment. PREMIUM represents users
          on the Premium plan; all other users are classified as
          STANDARD.
        data_type: string

      - name: notification_frequency_30d
        description: >
          Count of successfully delivered notifications received
          by the user during the approved 30-day activity window.
          Represents notification exposure rather than interaction.
        data_type: int64


  # ------------------------------------------------------------
  # CHURN
  # ------------------------------------------------------------

  - name: mart_churn

    description: >
      Analysis-ready user-level dataset for approved user-level
      Churn hypotheses. Combines the standardised Churn outcome
      with the analytical variables required for downstream
      investigation.
      Grain: one row per user.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: churn_flag
        description: >
          Business-defined Churn outcome calculated by
          int_churn.
        data_type: boolean
        tests:
          - not_null

      - name: failed_declined_transactions_30d
        description: >
          Count of FAILED or DECLINED transactions attempted by
          the user during the approved 30-day activity window.
        data_type: int64

      - name: country
        description: >
          Country associated with the user.
        data_type: string

  # ------------------------------------------------------------
  # CHURN BY TRANSACTION TYPE
  # ------------------------------------------------------------

  - name: mart_churn_transaction_types

    description: >
      Analysis-ready dataset for the approved Churn by
      Transaction Type hypothesis. Combines transaction-type
      behaviour with the user-level Churn outcome.
      Grain: one row per user × transaction type.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null

      - name: transaction_type
        description: >
          Transaction type supplied by the source dataset.
        data_type: string
        tests:
          - not_null

      - name: transaction_count
        description: >
          Count of successful transactions for the user and
          transaction type across the available successful
          transaction history.
        data_type: int64

      - name: transaction_share
        description: >
          Share of the user's successful transactions represented
          by the transaction type across the available successful
          transaction history.
        data_type: float64

      - name: churn_flag
        description: >
          User-level Churn outcome calculated by int_churn.
          The outcome is repeated across the user's transaction-type
          rows without changing the model grain.
        data_type: boolean
