version: 2

# Intermediate models contain reusable analytical variables.
# User profile attributes describe who the user is.
# User activity variables describe what the user has done.
# Business KPI definitions are centralised in the KPI model.

models:

  - name: int_user_profile
    description: >
      Reusable user-level profile attributes required by the approved
      analytical hypotheses. Grain: one row per user.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user and primary key of the model.
        data_type: string
        tests:
          - not_null
          - unique

      - name: country
        description: >
          Country associated with the user at analysis time.
        data_type: string

      - name: crypto_adoption
        description: >
          Indicates whether Crypto functionality is enabled for the user
          at analysis time. Stored as a binary integer where 0 indicates
          not enabled and 1 indicates enabled.
        data_type: int64

      - name: plan_segment
        description: >
          Approved Premium versus Standard user grouping used for analysis.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values:
                  - STANDARD
                  - PREMIUM
