version: 2

models:

  # ============================================================
  # LEVEL 0 — DOMAIN-LEVEL SUPPORTING TRANSFORMATIONS
  # ============================================================

  # ------------------------------------------------------------
  # SUCCESSFUL TRANSACTION EVENTS
  # ------------------------------------------------------------

  - name: int_successful_transaction_events

    description: >
      Successful transaction events derived from the transaction
      domain. This model provides reusable event-level transaction
      dates, calendar periods, and transaction-type information
      for downstream business KPI and analytical logic.
      Grain: one row per successful transaction.

    config:
      contract:
        enforced: true

    columns:

      - name: transaction_id
        description: >
          Unique identifier for the successful transaction.
        data_type: string
        tests:
          - not_null
          - unique

      - name: user_id
        description: >
          Identifier of the user who completed the successful
          transaction.
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id

      - name: transaction_type
        description: >
          Transaction type supplied by the source dataset. Source
          transaction-type categories are preserved without additional
          grouping or reclassification.
        data_type: string
        tests:
          - not_null

      - name: transaction_date
        description: >
          Calendar date on which the successful transaction
          was recorded.
        data_type: date

      - name: transaction_week
        description: >
          Monday-based calendar week associated with the
          successful transaction.
        data_type: date

      - name: transaction_month
        description: >
          Calendar month associated with the successful
          transaction.
        data_type: date


  # ------------------------------------------------------------
  # TRANSACTION ACTIVITY
  # ------------------------------------------------------------

  - name: int_transaction_activity

    description: >
      User-level transaction activity derived from the transaction
      domain. This model isolates transaction-specific transformations
      before they are assembled into reusable user-level analytical
      models.
      Grain: one row per user.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: transaction_frequency
        description: >
          Count of successful transactions completed by the user
          across the available transaction history.
        data_type: int64

      - name: failed_declined_transactions
        description: >
          Count of transactions attempted by the user across the
          available transaction history that ended in a FAILED or
          DECLINED state.
        data_type: int64

      - name: total_transaction_count
        description: >
          Total number of transactions recorded for the user across
          all transaction states in the available transaction history.
        data_type: int64

      - name: activity_period
        description: >
          Calendar week associated with the user's most recent
          successful transaction. The calendar week begins on Monday.
        data_type: date

      - name: last_successful_transaction_date
        description: >
          Date of the user's most recent successful transaction.
        data_type: date


  # ------------------------------------------------------------
  # NOTIFICATION ACTIVITY
  # ------------------------------------------------------------

  - name: int_notification_activity

    description: >
      User-level notification activity derived from the notification
      domain. This model isolates notification-specific transformations
      before they are assembled into reusable user-level analytical
      models.
      Grain: one row per user.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: notification_frequency
        description: >
          Count of successfully delivered notifications received by
          the user across the available notification history.
          Represents notification exposure rather than interaction.
        data_type: int64


  # ------------------------------------------------------------
  # MERCHANT ACTIVITY
  # ------------------------------------------------------------

  - name: int_merchant_activity

    description: >
      User-level merchant activity derived from transaction merchant
      information. This model isolates merchant-specific aggregation
      before it is assembled into reusable user-level analytical
      models.
      Grain: one row per user.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: merchant_spending_category
        description: >
          Merchant Category Code with the highest total successful
          transaction amount for the user across the available
          transaction history. Null when no eligible MCC is available.
        data_type: int64


  # ============================================================
  # LEVEL 1 — REUSABLE ANALYTICAL MODELS
  # ============================================================

  # ------------------------------------------------------------
  # USER PROFILE
  # ------------------------------------------------------------

  - name: int_user_profile

    description: >
      Reusable user-level profile and segmentation attributes derived
      from the users domain. This model represents who the user is
      and provides approved profile attributes for downstream
      analytical models.
      Grain: one row per user.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: country
        description: >
          Country associated with the user.
        data_type: string

      - name: crypto_adoption
        description: >
          Binary indicator showing whether cryptocurrency functionality
          is enabled for the user. 0 = not enabled, 1 = enabled.
        data_type: int64

      - name: plan_segment
        description: >
          Standardised user plan segment. PREMIUM represents users
          on the Premium plan; all other users are classified as
          STANDARD.
        data_type: string


  # ------------------------------------------------------------
  # USER ACTIVITY
  # ------------------------------------------------------------

  - name: int_user_activity

    description: >
      Reusable user-level behavioural metrics assembled from the
      transaction, notification, and merchant activity domains.
      This model represents what the user has done and provides
      approved behavioural variables for downstream analytical
      models.
      Grain: one row per user.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: transaction_frequency
        description: >
          Count of successful transactions completed by the user
          across the available transaction history.
        data_type: int64

      - name: notification_frequency
        description: >
          Count of successfully delivered notifications received by
          the user across the available notification history.
          Represents notification exposure rather than interaction.
        data_type: int64

      - name: failed_declined_transactions
        description: >
          Count of FAILED or DECLINED transactions completed by the
          user across the available transaction history.
        data_type: int64

      - name: total_transaction_count
        description: >
          Total number of transactions recorded for the user across
          all transaction states in the available transaction history.
        data_type: int64

      - name: merchant_spending_category
        description: >
          Merchant Category Code with the highest total successful
          transaction amount for the user across the available
          transaction history. Null when no eligible MCC is available.
        data_type: int64

      - name: activity_period
        description: >
          Calendar week associated with the user's most recent
          successful transaction. The calendar week begins on Monday.
        data_type: date

      - name: last_successful_transaction_date
        description: >
          Date of the user's most recent successful transaction.
        data_type: date


  # ------------------------------------------------------------
  # USER ACTIVATION
  # ------------------------------------------------------------

  - name: int_activation

    description: >
      User-level Activation KPI derived from the approved Activation
      definition.
      Grain: one row per user.

      Activation is achieved when a user completes at least one
      successful transaction.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: activation_flag
        description: >
          Boolean flag indicating whether the user has completed
          at least one successful transaction.
        data_type: boolean


  # ------------------------------------------------------------
  # USER TRANSACTION TYPES
  # ------------------------------------------------------------

  - name: int_user_transaction_types

    description: >
      Reusable transaction-type behavioural model derived directly
      from successful transaction events. This model represents how
      the user transacts and preserves the natural user by
      transaction-type analytical grain.
      Grain: one row per user per transaction type.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user. The user may appear in
          multiple rows because the model grain is one row per
          user per transaction type.
        data_type: string
        tests:
          - not_null

      - name: transaction_type
        description: >
          Transaction type supplied by the source dataset. Source
          transaction-type categories are preserved without additional
          grouping or reclassification.
        data_type: string
        tests:
          - not_null

      - name: transaction_count
        description: >
          Count of successful transactions of the given transaction
          type for the user across the available successful
          transaction history.
        data_type: int64

      - name: transaction_share
        description: >
          Proportion of the user's successful transactions represented
          by the given transaction type across the available successful
          transaction history.
        data_type: float64


  # ============================================================
  # LEVEL 2 — BUSINESS LOGIC
  # ============================================================

  # ------------------------------------------------------------
  # ENGAGEMENT
  # ------------------------------------------------------------

  - name: int_engagement

    description: >
      User-level Engagement KPI derived from the approved business
      definition. This model evaluates whether the user completed
      at least one successful transaction in three of the previous
      four completed Monday-based calendar weeks before the analysis
      date.
      Grain: one row per user.

      The reusable successful transaction event logic is provided
      by int_successful_transaction_events.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: engagement_flag
        description: >
          Boolean flag indicating whether the user meets the approved
          Engagement definition: at least one successful transaction
          in three of the previous four completed Monday-based
          calendar weeks before the analysis date.
        data_type: boolean


  # ------------------------------------------------------------
  # RETENTION
  # ------------------------------------------------------------

  - name: int_retention

    description: >
      User-level Retention business outcome derived from the approved
      Retention definition.
      Grain: one row per user.

      The reusable successful transaction event logic is provided
      by int_successful_transaction_events. Calendar-month activity
      and consecutive-month evaluation are performed here because
      they represent the Retention business definition.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: retention_flag
        description: >
          Indicates whether the user has qualified for Retention
          through three consecutive active completed calendar months
          and has remained active through every subsequent completed
          calendar month.
        data_type: boolean


  # ------------------------------------------------------------
  # CHURN
  # ------------------------------------------------------------

  - name: int_churn

    description: >
      User-level Churn business outcome derived from the approved
      Churn definition.
      Grain: one row per user.

      The reusable successful transaction event logic is provided
      by int_successful_transaction_events. The 90-day inactivity
      evaluation remains in this KPI model because it represents
      the approved Churn business definition.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for the user.
        data_type: string
        tests:
          - not_null
          - unique

      - name: churn_flag
        description: >
          Indicates whether the user has had no successful
          transaction for at least 90 consecutive days, provided
          that the required 90-day observation period exists.
        data_type: boolean
