version: 2

# Staging models provide a clean, standardised representation of the
# raw NeoBank sources for downstream analytical modelling.
# Business definitions and KPI logic are applied in later layers.

models:

  - name: stg_users
    description: >
      Standardised user-level source data. Column names and data types
      are normalised while preserving the meaning of the raw source.

    config:
      contract:
        enforced: true

    columns:

      - name: user_id
        description: >
          Unique identifier for each NeoBank user. Primary key used to
          connect users with transactions and notifications.
        data_type: string
        tests:
          - unique
          - not_null

      - name: birth_year
        description: >
          Calendar year in which the user was born.
        data_type: int64

      - name: country
        description: >
          ISO country code representing the user's registered country.
        data_type: string

      - name: city
        description: >
          Registered city associated with the user's account.
        data_type: string

      - name: created_at
        description: >
          Timestamp when the user account was created.
        data_type: timestamp

      - name: plan
        description: >
          Subscription plan assigned to the user.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values:
                  - STANDARD
                  - PREMIUM
                  - PREMIUM_FREE
                  - PREMIUM_OFFER
                  - METAL
                  - METAL_FREE

      - name: num_contacts
        description: >
          Number of contacts associated with the user.
        data_type: int64

      - name: num_referrals
        description: >
          Number of referral invitations made by the user.
        data_type: int64

      - name: num_successful_referrals
        description: >
          Number of referral invitations that resulted in successful
          new-user registrations.
        data_type: int64

      - name: crypto_enabled
        description: >
          Integer source flag indicating whether the Crypto feature
          has been enabled for the user.
        data_type: int64

      - name: marketing_push_enabled
        description: >
          Integer source flag indicating whether marketing push
          notifications are enabled for the user.
        data_type: int64

      - name: marketing_email_enabled
        description: >
          Integer source flag indicating whether marketing email
          notifications are enabled for the user.
        data_type: int64


  - name: stg_transactions
    description: >
      Standardised transaction-level source data. Column names and data
      types are normalised while preserving the meaning of the raw source.
      This model provides the transaction events used by downstream
      behavioural and KPI models.

    config:
      contract:
        enforced: true

    columns:

      - name: transaction_id
        description: >
          Unique identifier for each financial transaction.
        data_type: string
        tests:
          - unique
          - not_null

      - name: user_id
        description: >
          Identifier of the user who performed the transaction.
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id

      - name: transaction_type
        description: >
          Type of financial transaction recorded by the source system.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values:
                  - ATM
                  - CARD_PAYMENT
                  - CARD_REFUND
                  - CASHBACK
                  - EXCHANGE
                  - FEE
                  - REFUND
                  - TAX
                  - TOPUP
                  - TRANSFER

      - name: transaction_currency
        description: >
          Currency code associated with the transaction.
        data_type: string

      - name: amount_usd
        description: >
          Transaction amount expressed in US dollars.
        data_type: float64

      - name: transaction_state
        description: >
          Final processing state of the transaction.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values:
                  - CANCELLED
                  - COMPLETED
                  - DECLINED
                  - FAILED
                  - PENDING
                  - REVERTED

      - name: cardholder_presence
        description: >
          Indicates how the cardholder was present when the transaction
          was initiated.
        data_type: string

      - name: merchant_mcc
        description: >
          Merchant Category Code associated with the transaction.
        data_type: int64

      - name: merchant_city
        description: >
          City associated with the merchant.
        data_type: string

      - name: merchant_country
        description: >
          Country associated with the merchant.
        data_type: string

      - name: direction
        description: >
          Indicates the direction of funds for the transaction.
        data_type: string

      - name: created_at
        description: >
          Timestamp when the transaction was recorded.
        data_type: timestamp


  - name: stg_notifications
    description: >
      Standardised notification-event source data. Column names and data
      types are normalised while preserving the meaning of the raw source.
      Notification events are used downstream to calculate notification
      frequency based on notification exposure or delivery.

    config:
      contract:
        enforced: true

    columns:

      - name: reason
        description: >
          Event or reason that generated the notification.
        data_type: string

      - name: channel
        description: >
          Channel through which the notification was delivered.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values:
                  - EMAIL
                  - PUSH
                  - SMS

      - name: status
        description: >
          Delivery status recorded for the notification.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values:
                  - SENT
                  - FAILED

      - name: user_id
        description: >
          Identifier of the user who received the notification.
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id

      - name: created_at
        description: >
          Timestamp when the notification event was recorded.
        data_type: timestamp
